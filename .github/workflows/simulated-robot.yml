# Hardware-free CI: unit tests + SimReachyTransport smoke through DeviceRuntime.
# Does not install reachy-mini (PyGObject/GStreamer) or start NATS / portal.

name: Simulated robot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (CI extras — no reachy-mini SDK)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Unit tests (simulated transport and media)
        run: python -m unittest discover -s tests -v

      - name: Smoke test simulated DeviceRuntime
        env:
          PYTHONPATH: src
        run: python tests/smoke_sim_runtime.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run tests in CI container
        run: docker build -f docker/ci/Dockerfile .
